[project]
name = "viva-ingest"
version = "0.1.0"
description = "Structural PDF/DOCX parsing for Viva resume chunking (docling)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "docling>=2.15",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
